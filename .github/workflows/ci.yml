name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-dev \
            meson ninja-build \
            libgtk-4-dev libadwaita-1-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 python3-gi \
            desktop-file-utils appstream \
            blueprint-compiler \
            glib-2.0-dev libglib2.0-dev libglib2.0-bin \
            python3-peewee python3-pytest python3-pytest-mock python3-pil \
            fonts-cantarell xvfb

      - name: Install ruff
        run: |
          python3 -m pip install --user ruff

      - name: Run checks (full, including snapshots)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          STREAKS_HEADLESS=1 scripts/check.sh
